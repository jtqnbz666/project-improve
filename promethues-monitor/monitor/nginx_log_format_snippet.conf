# 在 http 块中定义日志格式
log_format prometheus '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';

# 在 server 块中使用该格式
access_log /var/log/nginx/access.log prometheus;
