server {
    listen 80;
    server_name localhost;

    # ... 其他配置 ...

    # 添加这个 location 用于暴露 Nginx 状态
    location /stub_status {
        stub_status on;
        access_log off;
        # 只允许本地或内网 IP 访问，为了安全
        allow 127.0.0.1;
        allow 172.16.0.0/12; # 允许 Docker 网段访问
        allow 10.0.0.0/8;    # 允许内网访问
        deny all;
    }
}
